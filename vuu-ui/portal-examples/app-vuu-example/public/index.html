<!doctype html>
<html
  class="salt-density-medium salt-theme salt-theme-next vuu-theme"
  data-accent="purple"
  data-corner="rounded"
  data-mode="light"
  lang="en"
>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="vuu-icon.svg" />
    <link rel="manifest" href="manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Vuu generic UI" />
    <script type="module">
      window.vuuConfig = fetch("config.json").then((res) => {
        if (res.ok) {
          return res.json();
        } else {
          throw Error("Failed to load application config");
        }
      });
    </script>
    <title>VUU App</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
