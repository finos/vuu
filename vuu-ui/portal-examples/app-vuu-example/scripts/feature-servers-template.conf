# Template-managed block for feature apps on ports 5003-5007.
# Build tooling can regenerate this file.
# /opt/homebrew/etc/nginx/servers/feature-servers-template.conf

map $host $dist_portal_root {
    default /Users/steve/github/heswell/copilot-worktrees/vuu/heswell-copilot-potential-engine/vuu-ui/dist_portal;
}

map $server_port $app_root {
    5003 $dist_portal_root/feature-filter-table;
    5004 $dist_portal_root/feature-simple-div;
    5005 $dist_portal_root/feature-basket-trading;
    5006 $dist_portal_root/feature-instrument-tiles;
    5007 $dist_portal_root/feature-user-admin;
}

server {
    listen 5001;
    server_name localhost;

    location /api/authn {
        access_log  /opt/homebrew/var/log/nginx/proxy.log  proxy;
        proxy_pass https://localhost:8443/api/authn;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root $dist_portal_root/simple-login-service;
        index index.html;
    }
}

server {
    listen 5002;
    server_name localhost;

    location / {
        root $dist_portal_root/app-vuu-example;
        index index.html;
    }
}

server {
    listen 5003;
    listen 5004;
    listen 5005;
    listen 5006;
    listen 5007;
    server_name localhost;

    set $mf_manifest_cors_origin http://localhost:5002;

    include /opt/homebrew/etc/nginx/mf-manifest-location.conf;

    location / {
        root $app_root;
        index index.html;
    }
}