<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>How a Vuu portal comes alive</title>
    <style>
      :root {
        --ink: #f5f9ff;
        --muted: #9fb3c8;
        --muted-strong: #c5d5e4;
        --panel: rgba(18, 41, 67, 0.84);
        --panel-soft: rgba(25, 55, 86, 0.62);
        --line: rgba(173, 204, 229, 0.2);
        --cyan: #5bd6e2;
        --blue: #52aaf4;
        --violet: #b59bff;
        --coral: #ff9a9f;
        --green: #75e6bf;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 10%, rgba(48, 121, 174, 0.28), transparent 31rem),
          radial-gradient(circle at 88% 90%, rgba(83, 63, 161, 0.25), transparent 34rem),
          #071525;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button {
        font: inherit;
      }

      .presentation {
        width: min(1500px, calc(100% - 48px));
        min-height: calc(100vh - 48px);
        margin: 24px auto;
        padding: 28px 34px 30px;
        overflow: hidden;
        border: 1px solid rgba(186, 216, 239, 0.19);
        border-radius: 28px;
        background: linear-gradient(145deg, rgba(11, 31, 53, 0.96), rgba(8, 22, 39, 0.94));
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.32);
      }

      .content,
      .footer {
        position: relative;
        z-index: 1;
      }

      .content {
        display: block;
      }

      .visual {
        min-width: 0;
        padding: 22px 22px 18px;
        border: 1px solid rgba(186, 216, 239, 0.18);
        border-radius: 22px;
        background:
          linear-gradient(rgba(102, 145, 182, 0.075) 1px, transparent 1px),
          linear-gradient(90deg, rgba(102, 145, 182, 0.075) 1px, transparent 1px),
          linear-gradient(145deg, rgba(21, 51, 82, 0.9), rgba(9, 26, 46, 0.94));
        background-size: 34px 34px, 34px 34px, auto;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 24px 70px rgba(0, 0, 0, 0.2);
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .visual svg text {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .node,
      .route,
      .callout,
      .pulse {
        opacity: 0;
        pointer-events: none;
        transition: opacity 360ms ease, transform 360ms ease;
      }

      .node {
        transform: translateY(10px);
      }

      .node-clickable.is-visible {
        pointer-events: auto;
        cursor: pointer;
      }

      .node-clickable.is-visible:hover > rect,
      .node-clickable.is-visible:focus > rect {
        stroke: #BCECF1;
        stroke-width: 2;
      }

      .login-panel.is-visible {
        pointer-events: auto;
        cursor: pointer;
      }

      .login-panel.is-visible:hover > rect,
      .login-panel.is-visible:focus > rect {
        stroke: #BCECF1;
        stroke-width: 2;
      }

      .route,
      .callout {
        transform: translateY(5px);
      }

      .is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .route.is-past {
        opacity: 0;
      }

      .route.persistent-websocket.is-past {
        opacity: 1;
      }

      .route.is-superseded {
        opacity: 0;
      }

      .node.is-retired {
        opacity: 0;
        pointer-events: none;
      }

      .login-panel.is-retired {
        opacity: 0;
        pointer-events: none;
      }

      .message {
        opacity: 0;
        pointer-events: none;
        transition: opacity 360ms ease;
      }

      .message.is-visible {
        opacity: 1;
      }

      .message.is-past {
        opacity: 0;
      }

      .menu-preview.is-replaced {
        opacity: 0;
        pointer-events: none;
      }

      .menu-preview.is-visible:not(.is-replaced) {
        pointer-events: auto;
      }

      .menu-item-orders {
        pointer-events: none;
      }

      .menu-preview.is-visible .menu-item-orders {
        pointer-events: auto;
        cursor: pointer;
      }

      .menu-item-orders:hover rect,
      .menu-item-orders:focus rect {
        fill: #245D83;
        stroke: #BCECF1;
        stroke-width: 2;
      }

      .menu-item-orders.is-selected rect {
        fill: #6A354C;
        stroke: #FF9A9F;
        stroke-width: 2;
      }

      .menu-item-orders.is-selected text {
        fill: #FFE4E5;
      }

      .url-box.is-visible {
        pointer-events: auto;
        cursor: text;
      }

      .url-box:hover rect,
      .url-box:focus rect,
      .url-box.is-active rect {
        stroke: #BCECF1;
        stroke-opacity: .8;
      }

      .pulse.is-visible {
        animation: pulse 1.8s ease-in-out infinite;
        opacity: 1;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      @media (max-width: 1050px) {
        .presentation {
          width: min(900px, calc(100% - 24px));
          margin: 12px auto;
          padding: 24px;
        }

        .content {
          grid-template-columns: 1fr;
          gap: 34px;
        }

        .story {
          max-width: 720px;
        }

        .visual {
          order: -1;
        }
      }

      @media (max-width: 700px) {
        .presentation {
          padding: 20px 16px 22px;
          border-radius: 20px;
        }

        .visual {
          padding: 12px;
          border-radius: 16px;
        }

      }
    </style>
  </head>

              <rect x="-28" y="-9" width="56" height="18" rx="6" fill="#2A315D" stroke="#B59BFF" stroke-width="1.5" stroke-opacity=".95"/>
              <text x="0" y="3" text-anchor="middle" fill="#D6CBFF" font-size="8" font-weight="800">LOGIN</text>
              <animateMotion id="orders-login-motion" begin="indefinite" dur="2.1s" repeatCount="1" path="M330 352H557"/>
            </g>

            <g class="message reveal-16 orders-login-success">
              <rect x="-46" y="-9" width="92" height="18" rx="6" fill="#185B65" stroke="#75E6BF" stroke-width="1.5" stroke-opacity=".95"/>
              <text x="0" y="3" text-anchor="middle" fill="#C8F8E4" font-size="8" font-weight="800">LOGIN SUCCESS</text>
              <animateMotion id="orders-login-success-motion" begin="indefinite" dur="2.1s" repeatCount="1" path="M557 352H330"/>

      </div>

    </main>

    <script>
      const stages = [
        {
          title: "Enter the portal address",
          copy: "Click the browser address box to begin. The portal address will be typed here.",
          detail: "The browser is ready for the first request, but nothing has been sent yet.",
          status: "Click the address box",
        },
        {
          title: "Request the portal shell",
          copy: "The browser types /nexus and sends the request to nginx.",
          detail: "nginx appears as the entry point for the portal shell.",
          status: "Request sent",
        },
        {
          title: "App shell loaded",
          copy: "nginx has delivered the app shell. Click the dashed browser area to begin sign-in.",
          detail: "The shell is present, but the portal has not rendered its authenticated content yet.",
          status: "Click loaded app area",
        },
        {
          title: "Open secure sign-in",
          copy: "The browser sends the secure sign-in request through nginx to Keycloak.",
          detail: "The request arrow is replaced by Keycloak's response before the login panel appears.",
          status: "Opening sign-in",
        },
        {
          title: "Show the login panel",
          copy: "Keycloak responds with the panel where you can enter your details.",
          detail: "Click the login panel to reveal the form fields and continue.",
          status: "Click login panel",
        },
        {
          title: "Receive the token and app shell",
          copy: "Keycloak returns the sign-in response. The browser can now show the authenticated Vuu Portal shell.",
          detail: "The login panel is replaced by the authenticated app shell — menus, layout and space for features.",
          status: "Portal is ready",
        },
        {
          title: "Call the auth endpoint",
          copy: "The browser makes an HTTPS call to the Portal Vuu Server's auth endpoint, carrying the bearer token from Keycloak.",
          detail: "Click the loading app to start the Portal server's Keycloak check.",
          status: "Click loading app",
        },
        {
          title: "Receive the token",
          copy: "The auth endpoint responds with the token that the portal session will use.",
          detail: "This response proves that the Portal Vuu Server has accepted the browser's identity.",
          status: "Token received",
        },
        {
          title: "Open WebSocket and LOGIN",
          copy: "The browser opens a WebSocket to the Portal Vuu Server and sends a LOGIN message.",
          detail: "This persistent connection is ready to carry the portal session and its messages.",
          status: "WebSocket login sent",
        },
        {
          title: "Receive LOGIN_SUCCESS",
          copy: "The Portal Vuu Server confirms the WebSocket login and sends the module entitlements.",
          detail: "The permitted applications can now be used to build the portal navigation.",
          status: "Portal session established",
        },
        {
          title: "Load the Orders module",
          copy: "Clicking Orders asks nginx for the remote module.",
          detail: "When the empty Orders app appears, click it to start the Orders server session.",
          status: "Click Orders app",
        },
        {
          title: "Call the Orders auth endpoint",
          copy: "The Orders module makes an HTTPS call to its Vuu server.",
          detail: "The Orders auth request is now in flight; the Keycloak validation follows automatically.",
          status: "Orders auth request sent",
        },
        {
          title: "Validate the Orders token",
          copy: "The Orders Vuu Server sends the bearer token to Keycloak for validation.",
          detail: "Keycloak accepts the identity before the Orders server returns a token to the browser.",
          status: "Validating Orders session",
        },
        {
          title: "Receive the Orders token",
          copy: "The Orders auth endpoint responds with a token for the selected module.",
          detail: "Click the Orders loading screen to open the server's persistent connection.",
          status: "Click Orders loading screen",
        },
        {
          title: "Open the Orders WebSocket and LOGIN",
          copy: "The browser opens a WebSocket to the Orders Vuu Server and sends a LOGIN message.",
          detail: "The Orders connection is ready to carry its session and data messages.",
          status: "Orders WebSocket login sent",
        },
        {
          title: "LOGIN SUCCESS",
          copy: "The Orders Vuu Server confirms the login on the WebSocket.",
          detail: "The selected feature is now authenticated and ready to receive data.",
          status: "Orders session established",
        },
        {
          title: "Keep it live",
          copy: "The new view asks for its data, receives its first picture, then keeps receiving changes as the world moves.",
          detail: "One click has taken us from a web address to a live, authenticated workspace with continuously updating data.",
          status: "Everything is live",
        },
      ];

      const presentation = document.getElementById("presentation");
      const portalLoadingShell = document.getElementById("portal-loading-shell");
      const loginPanel = document.getElementById("login-panel");
      const appLoadedBox = document.getElementById("app-loaded-box");
      const usernameField = document.getElementById("username-field");
      const passwordField = document.getElementById("password-field");
      const urlBox = document.getElementById("url-box");
      const urlText = document.getElementById("portal-url-text");
      const ordersMenuItem = document.getElementById("orders-menu-item");
      const ordersApp = document.getElementById("orders-app");
      const revealItems = [...presentation.querySelectorAll("[class*=\"reveal-\"]")];
      let currentStep = 1;
      let portalHandshakeStarted = false;
      let authResponseVisible = false;
      let portalFlowStarted = false;
      let portalFlowComplete = false;
      let portalWebSocketStarted = false;
      let portalLoginResponseVisible = false;
      let vuuTokenVisible = false;
      let entitlementsReceived = false;
      let loginPanelOpened = false;
      let loginFieldsComplete = false;
      let credentialResponseVisible = false;
      let loginFlowComplete = false;
      let appLoadedBoxClicked = false;
      let secureSignInFlowStarted = false;
      let secureSignInResponseVisible = false;
      let secureSignInFlowComplete = false;
      let secureSignInFlowTimer = null;
      let loginTypingTimer = null;
      let credentialFlowTimer = null;
      let portalAuthTimer = null;
      let ordersSelected = false;
      let ordersHandshakeStarted = false;
      let ordersAuthResponseVisible = false;
      let ordersTokenResponseVisible = false;
      let ordersWebSocketStarted = false;
      let ordersLoginSent = false;
      let ordersLoginSuccessVisible = false;
      let ordersDataVisible = false;
      let urlTypingStarted = false;
      let urlTypingComplete = false;
      let urlTypingTimer = null;
      let nginxFlowStarted = false;
      let nginxResponseVisible = false;
      let ordersAppClicked = false;
      let nginxFlowTimer = null;
      let ordersFlowTimer = null;
      let shellFlowStarted = false;
      let shellResponseVisible = false;
      let shellAppLoaded = false;
      let shellFlowTimer = null;

      function setStep(step) {
        currentStep = Math.max(1, Math.min(stages.length, step));
        presentation.dataset.step = currentStep;
        if (urlTypingComplete) {
          if (currentStep === 5) {
            urlText.textContent = "/keycloak";
          } else if (currentStep < 5 || (currentStep >= 6 && currentStep < 11 && !ordersSelected)) {
            urlText.textContent = "/nexus";
          }
        }
        urlBox.classList.toggle("is-active", urlTypingStarted);
        ordersMenuItem.classList.toggle("is-selected", ordersSelected);

        revealItems.forEach((item) => {
          const revealStep = Number(item.className.baseVal?.match(/reveal-(\d+)/)?.[1] ?? item.className.match(/reveal-(\d+)/)?.[1]);
          const wasVisible = item.classList.contains("is-visible");
          const handshakeVisible = portalHandshakeStarted
            && (!item.classList.contains("auth-request") || !authResponseVisible)
            && (!item.classList.contains("auth-response") || authResponseVisible);
          const ordersHandshakeVisible = ordersHandshakeStarted
            && (!item.classList.contains("orders-auth-request") || !ordersAuthResponseVisible)
            && (!item.classList.contains("orders-auth-response") || ordersAuthResponseVisible);
          const isVisible = revealStep <= currentStep
            && (!item.classList.contains("portal-handshake") || handshakeVisible)
            && (!item.classList.contains("orders-handshake") || ordersHandshakeVisible)
            && (!item.classList.contains("secure-request") || !secureSignInResponseVisible)
            && (!item.classList.contains("secure-response") || secureSignInResponseVisible)
            && (!item.classList.contains("credential-field") || loginPanelOpened)
            && (!item.classList.contains("credential-request") || loginFieldsComplete && !credentialResponseVisible)
            && (!item.classList.contains("credential-response") || credentialResponseVisible)
            && (!item.classList.contains("portal-login-request") || !portalLoginResponseVisible)
            && (!item.classList.contains("portal-login-response") || portalLoginResponseVisible)
            && (!item.classList.contains("portal-vuu-token") || vuuTokenVisible)
            && (!item.classList.contains("menu-preview") || entitlementsReceived)
            && (!item.classList.contains("orders-app") || nginxResponseVisible)
            && (!item.classList.contains("orders-data") || ordersDataVisible);
          item.classList.toggle("is-visible", isVisible);
          item.classList.toggle("is-past",
            (item.classList.contains("route") || item.classList.contains("message"))
            && revealStep < currentStep);
          item.classList.toggle("is-retired",
            item.classList.contains("login-panel") && currentStep >= 6);
          item.classList.toggle("is-superseded",
            (item.classList.contains("module-request") && nginxResponseVisible)
            || (item.classList.contains("module-response") && !nginxResponseVisible)
            || (item.classList.contains("shell-request") && shellResponseVisible)
            || (item.classList.contains("shell-response") && !shellResponseVisible));
          const animation = item.querySelector("animateMotion");
          if (!wasVisible && isVisible && animation?.getAttribute("begin") === "indefinite") animation.beginElement();
        });

      }

      function startUrlTyping() {
        if (currentStep !== 1 || urlTypingStarted) return;
        urlTypingStarted = true;
        const url = "/nexus";
        let characterIndex = 0;
        urlText.textContent = "";
        urlTypingTimer = window.setInterval(() => {
          characterIndex += 1;
          urlText.textContent = url.slice(0, characterIndex);
          if (characterIndex === url.length) {
            window.clearInterval(urlTypingTimer);
            urlTypingTimer = null;
            urlTypingComplete = true;
            setStep(2);
            startShellFlow();
          }
        }, 90);
      }
      urlBox.addEventListener("click", startUrlTyping);
      urlBox.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          startUrlTyping();
        }
      });
      function startSecureSignInFlow() {
        if (currentStep !== 4 || secureSignInFlowStarted) return;
        secureSignInFlowStarted = true;
        secureSignInFlowTimer = window.setTimeout(() => {
          secureSignInFlowTimer = null;
          if (currentStep !== 4) return;
          secureSignInResponseVisible = true;
          setStep(currentStep);
          secureSignInFlowTimer = window.setTimeout(() => {
            secureSignInFlowTimer = null;
            if (currentStep !== 4) return;
            secureSignInFlowComplete = true;
            setStep(5);
          }, 1000);
        }, 1000);
      }
      function continueFromLoadedApp() {
        if (currentStep !== 3 || appLoadedBoxClicked) return;
        appLoadedBoxClicked = true;
        setStep(4);
        startSecureSignInFlow();
      }
      appLoadedBox.addEventListener("click", continueFromLoadedApp);
      appLoadedBox.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          continueFromLoadedApp();
        }
      });
      function startPortalAuthFlow() {
        if (currentStep !== 6 || portalFlowStarted) return;
        portalFlowStarted = true;
        setStep(7);
        portalAuthTimer = window.setTimeout(() => {
          portalAuthTimer = null;
          if (currentStep !== 7) return;
          portalHandshakeStarted = true;
          setStep(7);
        }, 1000);
      }
      function startPortalWebSocketFlow() {
        if (currentStep !== 8 || portalWebSocketStarted) return;
        portalWebSocketStarted = true;
        vuuTokenVisible = false;
        setStep(9);
      }
      function continueFromPortalLoadingShell() {
        if (currentStep === 6) {
          startPortalAuthFlow();
        } else if (currentStep === 8) {
          startPortalWebSocketFlow();
        }
      }
      portalLoadingShell.addEventListener("click", continueFromPortalLoadingShell);
      portalLoadingShell.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          continueFromPortalLoadingShell();
        }
      });
      function startLoginFlow() {
        if (currentStep !== 5 || loginPanelOpened) return;
        loginPanelOpened = true;
        setStep(5);
        const username = "username";
        const password = "password";
        let characterIndex = 0;
        loginTypingTimer = window.setInterval(() => {
          if (characterIndex < username.length) {
            characterIndex += 1;
            usernameField.textContent = username.slice(0, characterIndex);
          } else if (characterIndex < username.length + password.length) {
            characterIndex += 1;
            passwordField.textContent = password.slice(0, characterIndex - username.length);
          } else {
            window.clearInterval(loginTypingTimer);
            loginTypingTimer = null;
            loginFieldsComplete = true;
            setStep(5);
            credentialFlowTimer = window.setTimeout(() => {
              credentialFlowTimer = null;
              if (currentStep !== 5) return;
              credentialResponseVisible = true;
              setStep(5);
              credentialFlowTimer = window.setTimeout(() => {
                credentialFlowTimer = null;
                if (currentStep !== 5) return;
                credentialResponseVisible = false;
                loginFlowComplete = true;
                setStep(6);
              }, 1000);
            }, 1000);
          }
        }, 45);
      }
      loginPanel.addEventListener("click", startLoginFlow);
      loginPanel.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          startLoginFlow();
        }
      });
      document.getElementById("auth-check-motion").addEventListener("endEvent", () => {
        if (!portalHandshakeStarted) return;
        authResponseVisible = true;
        setStep(7);
        portalAuthTimer = window.setTimeout(() => {
          portalAuthTimer = null;
          if (currentStep !== 7) return;
          portalFlowComplete = true;
          setStep(8);
        }, 1000);
      });
      document.getElementById("login-response-motion").addEventListener("endEvent", () => {
        if (currentStep !== 9 || !portalLoginResponseVisible) return;
        entitlementsReceived = true;
        setStep(9);
      });
      document.getElementById("portal-login-motion").addEventListener("endEvent", () => {
        if (currentStep !== 9 || !portalWebSocketStarted || portalLoginResponseVisible) return;
        portalAuthTimer = window.setTimeout(() => {
          portalAuthTimer = null;
          if (currentStep !== 9 || portalLoginResponseVisible) return;
          portalLoginResponseVisible = true;
          setStep(9);
        }, 1000);
      });
      document.getElementById("portal-token-response-motion").addEventListener("endEvent", () => {
        if (currentStep !== 8 || vuuTokenVisible) return;
        vuuTokenVisible = true;
        setStep(8);
      });
      document.getElementById("orders-auth-check-motion").addEventListener("endEvent", () => {
        if (!ordersHandshakeStarted) return;
        ordersAuthResponseVisible = true;
        setStep(currentStep);
        ordersFlowTimer = window.setTimeout(() => {
          ordersFlowTimer = null;
          if (currentStep !== 13 || !ordersAuthResponseVisible) return;
          ordersTokenResponseVisible = true;
          setStep(14);
        }, 1000);
      });
      document.getElementById("orders-login-motion").addEventListener("endEvent", () => {
        if (currentStep < 15 || !ordersHandshakeStarted) return;
        ordersLoginSent = true;
        setStep(16);
      });
      document.getElementById("orders-login-success-motion").addEventListener("endEvent", () => {
        if (currentStep < 16 || !ordersHandshakeStarted) return;
        ordersLoginSuccessVisible = true;
        setStep(currentStep);
        ordersFlowTimer = window.setTimeout(() => {
          ordersFlowTimer = null;
          if (currentStep !== 16 || !ordersLoginSuccessVisible) return;
          ordersDataVisible = true;
          setStep(17);
        }, 1000);
      });
      function startShellFlow() {
        if (currentStep !== 2 || shellFlowStarted) return;
        shellFlowStarted = true;
        shellFlowTimer = window.setTimeout(() => {
          shellFlowTimer = null;
          if (currentStep !== 2) return;
          shellResponseVisible = true;
          setStep(currentStep);
          shellFlowTimer = window.setTimeout(() => {
            shellFlowTimer = null;
            if (currentStep !== 2) return;
            shellAppLoaded = true;
            setStep(3);
          }, 1000);
        }, 1000);
      }
      function startNginxFlow() {
        if (currentStep !== 11 || nginxFlowStarted) return;
        nginxFlowStarted = true;
        nginxFlowTimer = window.setTimeout(() => {
          nginxFlowTimer = null;
          if (currentStep !== 11) return;
          nginxResponseVisible = true;
          setStep(currentStep);
        }, 1000);
      }
      function selectOrders() {
        if (currentStep < 9 || !entitlementsReceived) return;
        ordersSelected = true;
        urlText.textContent = "/nexus/orders";
        setStep(Math.max(currentStep, 11));
        startNginxFlow();
      }
      ordersMenuItem.addEventListener("click", selectOrders);
      ordersMenuItem.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectOrders();
        }
      });
      function openOrdersApp() {
        if (currentStep === 11 && nginxResponseVisible && !ordersAppClicked) {
          ordersAppClicked = true;
          setStep(12);
          ordersFlowTimer = window.setTimeout(() => {
            ordersFlowTimer = null;
            if (currentStep !== 12 || ordersHandshakeStarted) return;
            ordersHandshakeStarted = true;
            setStep(13);
          }, 1000);
        } else if (currentStep === 14 && !ordersWebSocketStarted) {
          ordersWebSocketStarted = true;
          setStep(15);
        }
      }
      ordersApp.addEventListener("click", openOrdersApp);
      ordersApp.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openOrdersApp();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" || event.key === " ") {
          event.preventDefault();
          if (
            (currentStep === 1 && !urlTypingComplete)
            || (currentStep === 2 && !shellAppLoaded)
            || (currentStep === 3 && !appLoadedBoxClicked)
            || (currentStep === 4 && !secureSignInFlowComplete)
            || (currentStep === 5 && !loginFlowComplete)
            || (currentStep === 6 && !portalFlowStarted)
            || (currentStep === 7 && !portalFlowComplete)
            || (currentStep === 8 && !portalWebSocketStarted)
            || (currentStep === 9 && !entitlementsReceived)
            || (currentStep === 10 && !ordersSelected)
            || (currentStep === 11 && (!nginxResponseVisible || !ordersAppClicked))
            || (currentStep === 12 && !ordersHandshakeStarted)
            || (currentStep === 13 && !ordersTokenResponseVisible)
            || (currentStep === 14 && !ordersWebSocketStarted)
            || (currentStep === 15 && !ordersLoginSent)
            || (currentStep === 16 && !ordersDataVisible)
          ) return;
          setStep(currentStep + 1);
        }
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          if (currentStep === 2 && currentStep - 1 < 2) {
            window.clearTimeout(shellFlowTimer);
            shellFlowTimer = null;
            shellFlowStarted = false;
            shellResponseVisible = false;
            shellAppLoaded = false;
          }
          if (currentStep === 4 && currentStep - 1 < 4) {
            window.clearTimeout(secureSignInFlowTimer);
            secureSignInFlowTimer = null;
            secureSignInFlowStarted = false;
            secureSignInResponseVisible = false;
            secureSignInFlowComplete = false;
            appLoadedBoxClicked = false;
          }
          if (currentStep === 6 && currentStep - 1 < 6) {
            loginPanelOpened = false;
            loginFieldsComplete = false;
            credentialResponseVisible = false;
            loginFlowComplete = false;
            window.clearInterval(loginTypingTimer);
            loginTypingTimer = null;
            window.clearTimeout(credentialFlowTimer);
            credentialFlowTimer = null;
            usernameField.textContent = "";
            passwordField.textContent = "";
          }
          if (currentStep === 7 && currentStep - 1 < 7) {
            window.clearTimeout(portalAuthTimer);
            portalAuthTimer = null;
            portalFlowStarted = false;
            portalHandshakeStarted = false;
            authResponseVisible = false;
            portalFlowComplete = false;
          }
          if ((currentStep === 8 || currentStep === 9) && currentStep - 1 < 9) {
            window.clearTimeout(portalAuthTimer);
            portalAuthTimer = null;
            portalWebSocketStarted = false;
            portalLoginResponseVisible = false;
            vuuTokenVisible = false;
            entitlementsReceived = false;
          }
          if (currentStep === 5 && currentStep - 1 < 5) {
            loginPanelOpened = false;
            loginFieldsComplete = false;
            credentialResponseVisible = false;
            loginFlowComplete = false;
            window.clearInterval(loginTypingTimer);
            loginTypingTimer = null;
            window.clearTimeout(credentialFlowTimer);
            credentialFlowTimer = null;
            usernameField.textContent = "";
            passwordField.textContent = "";
          }
          if (currentStep === 11 && currentStep - 1 < 11) {
            window.clearTimeout(nginxFlowTimer);
            nginxFlowTimer = null;
            nginxFlowStarted = false;
            nginxResponseVisible = false;
          }
          if (currentStep === 12 && currentStep - 1 < 12) {
            window.clearTimeout(ordersFlowTimer);
            ordersFlowTimer = null;
            ordersAppClicked = false;
            ordersHandshakeStarted = false;
            ordersAuthResponseVisible = false;
            ordersTokenResponseVisible = false;
          }
          if (currentStep === 13 && currentStep - 1 < 13) {
            window.clearTimeout(ordersFlowTimer);
            ordersFlowTimer = null;
            ordersAuthResponseVisible = false;
            ordersTokenResponseVisible = false;
          }
          if (currentStep === 15 && currentStep - 1 < 15) {
            ordersWebSocketStarted = false;
            ordersLoginSent = false;
          }
          if (currentStep === 16 && currentStep - 1 < 16) {
            ordersLoginSuccessVisible = false;
          }
          setStep(currentStep - 1);
        }
      });

      setStep(1);
    </script>
  </body>
</html>
