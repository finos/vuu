<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>How a Vuu portal comes alive</title>
    <style>
      :root {
        --ink: #f5f9ff;
        --muted: #9fb3c8;
        --muted-strong: #c5d5e4;
        --panel: rgba(18, 41, 67, 0.84);
        --panel-soft: rgba(25, 55, 86, 0.62);
        --line: rgba(173, 204, 229, 0.2);
        --cyan: #5bd6e2;
        --blue: #52aaf4;
        --violet: #b59bff;
        --coral: #ff9a9f;
        --green: #75e6bf;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 10%, rgba(48, 121, 174, 0.28), transparent 31rem),
          radial-gradient(circle at 88% 90%, rgba(83, 63, 161, 0.25), transparent 34rem),
          #071525;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button {
        font: inherit;
      }

      .presentation {
        width: min(1500px, calc(100% - 48px));
        min-height: calc(100vh - 48px);
        margin: 24px auto;
        padding: 28px 34px 30px;
        overflow: hidden;
        border: 1px solid rgba(186, 216, 239, 0.19);
        border-radius: 28px;
        background: linear-gradient(145deg, rgba(11, 31, 53, 0.96), rgba(8, 22, 39, 0.94));
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.32);
      }

      .content,
      .footer {
        position: relative;
        z-index: 1;
      }

      .content {
        display: block;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .controls-below {
        justify-content: center;
        margin-top: 18px;
      }

      .control {
        padding: 12px 17px;
        color: var(--muted-strong);
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.035);
        cursor: pointer;
        transition: border-color 160ms ease, background 160ms ease, color 160ms ease, transform 160ms ease;
      }

      .control:hover:not(:disabled) {
        color: white;
        border-color: rgba(91, 214, 226, 0.7);
        background: rgba(91, 214, 226, 0.1);
        transform: translateY(-1px);
      }

      .control:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .control-primary {
        color: #072034;
        border-color: transparent;
        background: linear-gradient(100deg, var(--cyan), #87e7d2);
        font-weight: 800;
        box-shadow: 0 8px 22px rgba(91, 214, 226, 0.18);
      }

      .control-primary:hover:not(:disabled) {
        color: #072034;
        border-color: transparent;
        background: linear-gradient(100deg, #8ae9ef, #b2f5df);
      }

      .keyboard-hint {
        margin: 15px 0 0;
        color: #7189a0;
        font-size: 12px;
      }

      .visual {
        min-width: 0;
        padding: 22px 22px 18px;
        border: 1px solid rgba(186, 216, 239, 0.18);
        border-radius: 22px;
        background:
          linear-gradient(rgba(102, 145, 182, 0.075) 1px, transparent 1px),
          linear-gradient(90deg, rgba(102, 145, 182, 0.075) 1px, transparent 1px),
          linear-gradient(145deg, rgba(21, 51, 82, 0.9), rgba(9, 26, 46, 0.94));
        background-size: 34px 34px, 34px 34px, auto;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 24px 70px rgba(0, 0, 0, 0.2);
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .visual svg text {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .node,
      .route,
      .callout,
      .pulse {
        opacity: 0;
        pointer-events: none;
        transition: opacity 360ms ease, transform 360ms ease;
      }

      .node {
        transform: translateY(10px);
      }

      .node-clickable.is-visible {
        pointer-events: auto;
        cursor: pointer;
      }

      .node-clickable.is-visible:hover rect,
      .node-clickable.is-visible:focus rect {
        stroke: #BCECF1;
        stroke-width: 2;
      }

      .route,
      .callout {
        transform: translateY(5px);
      }

      .is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .route.is-past {
        opacity: 0;
      }

      .route.is-superseded {
        opacity: 0;
      }

      .node.is-retired {
        opacity: 0;
        pointer-events: none;
      }

      .message {
        opacity: 0;
        pointer-events: none;
        transition: opacity 360ms ease;
      }

      .message.is-visible {
        opacity: 1;
      }

      .message.is-past {
        opacity: 0;
      }

      .menu-preview.is-replaced {
        opacity: 0;
        pointer-events: none;
      }

      .menu-preview.is-visible:not(.is-replaced) {
        pointer-events: auto;
      }

      .menu-item-orders {
        pointer-events: none;
      }

      .menu-preview.is-visible .menu-item-orders {
        pointer-events: auto;
        cursor: pointer;
      }

      .menu-item-orders:hover rect,
      .menu-item-orders:focus rect {
        fill: #245D83;
        stroke: #BCECF1;
        stroke-width: 2;
      }

      .menu-item-orders.is-selected rect {
        fill: #6A354C;
        stroke: #FF9A9F;
        stroke-width: 2;
      }

      .menu-item-orders.is-selected text {
        fill: #FFE4E5;
      }

      .url-box.is-visible {
        pointer-events: auto;
        cursor: text;
      }

      .url-box:hover rect,
      .url-box:focus rect,
      .url-box.is-active rect {
        stroke: #BCECF1;
        stroke-opacity: .8;
      }

      .pulse.is-visible {
        animation: pulse 1.8s ease-in-out infinite;
        opacity: 1;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      @media (max-width: 1050px) {
        .presentation {
          width: min(900px, calc(100% - 24px));
          margin: 12px auto;
          padding: 24px;
        }

        .content {
          grid-template-columns: 1fr;
          gap: 34px;
        }

        .story {
          max-width: 720px;
        }

        .visual {
          order: -1;
        }
      }

      @media (max-width: 700px) {
        .presentation {
          padding: 20px 16px 22px;
          border-radius: 20px;
        }

        .visual {
          padding: 12px;
          border-radius: 16px;
        }

      }
    </style>
  </head>
  <body>
    <main class="presentation" id="presentation" data-step="1">
      <div class="content">
        <section class="visual" aria-label="Portal journey illustration">
          <svg viewBox="0 0 760 500" role="img" aria-labelledby="visual-title visual-description">

              </filter>
              <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">

              <marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6.5" refY="3.5" orient="auto">
                <path d="M0 0L7 3.5L0 7Z" fill="#75E6BF"/>
              </marker>
            </defs>

            <g class="node reveal-1" filter="url(#node-shadow)">

                <rect x="27" y="298" width="50" height="24" rx="5" fill="#123450" stroke="#5BD6E2" stroke-opacity=".3"/>
                <text x="52" y="313" text-anchor="middle" fill="#9FB3C8" font-size="8" font-weight="750">Risk</text>

                <text x="119" y="330" fill="#B9D7E5" font-size="9" font-weight="700">Risk</text>
              </g>
            </g>

            <g class="node reveal-2" filter="url(#node-shadow)">

              <text x="404" y="340" text-anchor="middle" fill="#75E6BF" font-size="11" font-weight="750">live updates keep flowing</text>
            </g>

            <g class="pulse reveal-13">
              <circle cx="610" cy="248" r="46" fill="none" stroke="#75E6BF" stroke-width="2" stroke-opacity=".42"/>
              <circle cx="610" cy="248" r="61" fill="none" stroke="#75E6BF" stroke-width="1" stroke-opacity=".18"/>
            </g>
          </svg>
        </section>
        <div class="controls controls-below">
          <button class="control" id="start" type="button">Start</button>
          <button class="control" id="back" type="button" disabled>Back</button>
          <button class="control control-primary" id="next" type="button">Reveal next <span aria-hidden="true">→</span></button>
        </div>
      </div>

    </main>

    <script>
      const stages = [
        {
          title: "Enter the portal address",
          copy: "Click the browser address box to begin. The portal address will be typed here.",
          detail: "The browser is ready for the first request, but nothing has been sent yet.",
          status: "Click the address box",
        },
        {
          title: "Request the portal shell",
          copy: "The browser types /nexus and sends the request to nginx.",
          detail: "nginx appears as the entry point for the portal shell.",
          status: "Request sent",
        },
        {
          title: "Receive the page",
          copy: "nginx sends the starting page back to the browser. The app is present, but there is no visible portal content yet.",
          detail: "A faint outline marks the space where the portal will appear after authentication.",
          status: "Page received",
        },
        {
          title: "Open secure sign-in",
          copy: "The page asks Keycloak to begin sign-in. The browser is sent to the trusted identity service.",
          detail: "This first conversation with Keycloak starts the sign-in experience.",
          status: "Opening sign-in",
        },
        {
          title: "Show the login panel",
          copy: "Keycloak responds with the panel where you can enter your details. It appears inside the browser.",
          detail: "The portal is still waiting. No Vuu session or feature has been opened yet.",
          status: "Login panel shown",
        },
        {
          title: "Receive the token and app shell",
          copy: "After you submit the login panel, Keycloak returns a token. The browser can now show the full Vuu Portal shell.",
          detail: "The login panel is replaced by the authenticated app shell — menus, layout and space for features.",
          status: "Portal is ready",
        },
        {
          title: "Call the auth endpoint",
          copy: "The browser makes an HTTPS call to the Portal Vuu Server's auth endpoint, carrying the bearer token from Keycloak.",
          detail: "Click the Portal vuu server to start its Keycloak check before it responds.",
          status: "Click Portal vuu server",
        },
        {
          title: "Receive the Vuu token",
          copy: "The auth endpoint responds with the Vuu token that the portal session will use.",
          detail: "This response proves that the Portal Vuu Server has accepted the browser's identity.",
          status: "Vuu token received",
        },
        {
          title: "Open WebSocket and LOGIN",
          copy: "The browser opens a WebSocket to the Portal Vuu Server and sends a LOGIN message.",
          detail: "This persistent connection is ready to carry the portal session and its messages.",
          status: "WebSocket login sent",
        },
        {
          title: "LOGIN SUCCESS and entitlements",
          copy: "The Portal Vuu Server sends LOGIN SUCCESS together with the module entitlements.",
          detail: "The permitted applications can now be used to build the portal navigation.",
          status: "Portal session established",
        },
        {
          title: "Load the Orders module",
          copy: "Clicking Orders asks nginx for the remote module.",
          detail: "The request is replaced by nginx's response, then the feature appears inside the portal shell.",
          status: "Orders module loading",
        },
        {
          title: "Connect the selected server",
          copy: "The selected module connects to the Vuu server that owns its data.",
          detail: "Only now does another Vuu server appear: it belongs to the feature you chose and opens its live WebSocket.",
          status: "Feature server connected",
        },
        {
          title: "Keep it live",
          copy: "The new view asks for its data, receives its first picture, then keeps receiving changes as the world moves.",
          detail: "One click has taken us from a web address to a live, authenticated workspace with continuously updating data.",
          status: "Everything is live",
        },
      ];

      const presentation = document.getElementById("presentation");
      const start = document.getElementById("start");
      const back = document.getElementById("back");
      const next = document.getElementById("next");
      const portalServerNode = document.getElementById("portal-server-node");
      const urlBox = document.getElementById("url-box");
      const urlText = document.getElementById("portal-url-text");
      const ordersMenuItem = document.getElementById("orders-menu-item");
      const revealItems = [...presentation.querySelectorAll("[class*=\"reveal-\"]")];
      let currentStep = 1;
      let portalHandshakeStarted = false;
      let authResponseVisible = false;
      let entitlementsReceived = false;
      let ordersSelected = false;
      let urlTypingStarted = false;
      let urlTypingComplete = false;
      let urlTypingTimer = null;
      let nginxFlowStarted = false;
      let nginxResponseVisible = false;
      let nginxFlowTimer = null;
      let shellFlowStarted = false;
      let shellResponseVisible = false;
      let shellAppLoaded = false;
      let shellFlowTimer = null;

      function setStep(step) {
        currentStep = Math.max(1, Math.min(stages.length, step));
        presentation.dataset.step = currentStep;
        back.disabled = currentStep === 1;
        next.disabled = currentStep === stages.length
          || (currentStep === 1 && !urlTypingComplete)
          || (currentStep === 2 && !shellAppLoaded)
          || (currentStep === 10 && !ordersSelected)
          || (currentStep === 11 && !nginxResponseVisible);
        next.innerHTML = currentStep === stages.length
          ? "Story complete <span aria-hidden=\"true\">✓</span>"
          : "Reveal next <span aria-hidden=\"true\">→</span>";
        urlBox.classList.toggle("is-active", urlTypingStarted);
        ordersMenuItem.classList.toggle("is-selected", ordersSelected);

        revealItems.forEach((item) => {
          const revealStep = Number(item.className.baseVal?.match(/reveal-(\d+)/)?.[1] ?? item.className.match(/reveal-(\d+)/)?.[1]);
          const wasVisible = item.classList.contains("is-visible");
          const handshakeVisible = portalHandshakeStarted
            && (!item.classList.contains("auth-request") || !authResponseVisible)
            && (!item.classList.contains("auth-response") || authResponseVisible);
          const isVisible = revealStep <= currentStep
            && (!item.classList.contains("portal-handshake") || handshakeVisible)
            && (!item.classList.contains("menu-preview") || entitlementsReceived);
          item.classList.toggle("is-visible", isVisible);
          item.classList.toggle("is-past", (item.classList.contains("route") || item.classList.contains("message")) && revealStep < currentStep);
          item.classList.toggle("is-replaced", item.classList.contains("menu-preview") && currentStep >= 12);
          item.classList.toggle("is-retired", item.classList.contains("module-nginx") && currentStep >= 12);
          item.classList.toggle("is-superseded",
            (item.classList.contains("module-request") && nginxResponseVisible)
            || (item.classList.contains("module-response") && !nginxResponseVisible)
            || (item.classList.contains("shell-request") && shellResponseVisible)
            || (item.classList.contains("shell-response") && !shellResponseVisible));
          const animation = item.querySelector("animateMotion");
          if (!wasVisible && isVisible && animation?.getAttribute("begin") === "indefinite") animation.beginElement();
        });

      }

      function startPortalHandshake() {
        if (currentStep < 7 || portalHandshakeStarted) return;
        portalHandshakeStarted = true;
        setStep(currentStep);
      }

      start.addEventListener("click", () => {
        if (urlTypingTimer) {
          window.clearInterval(urlTypingTimer);
          urlTypingTimer = null;
        }
        portalHandshakeStarted = false;
        authResponseVisible = false;
        entitlementsReceived = false;
        ordersSelected = false;
        urlTypingStarted = false;
        urlTypingComplete = false;
        urlText.textContent = "";
        nginxFlowStarted = false;
        nginxResponseVisible = false;
        if (nginxFlowTimer) {
          window.clearTimeout(nginxFlowTimer);
          nginxFlowTimer = null;
        }
        shellFlowStarted = false;
        shellResponseVisible = false;
        shellAppLoaded = false;
        if (shellFlowTimer) {
          window.clearTimeout(shellFlowTimer);
          shellFlowTimer = null;
        }
        setStep(1);
      });
      function startUrlTyping() {
        if (currentStep !== 1 || urlTypingStarted) return;
        urlTypingStarted = true;
        const url = "/nexus";
        let characterIndex = 0;
        urlText.textContent = "";
        urlTypingTimer = window.setInterval(() => {
          characterIndex += 1;
          urlText.textContent = url.slice(0, characterIndex);
          if (characterIndex === url.length) {
            window.clearInterval(urlTypingTimer);
            urlTypingTimer = null;
            urlTypingComplete = true;
            setStep(2);
            startShellFlow();
          }
        }, 90);
      }
      urlBox.addEventListener("click", startUrlTyping);
      urlBox.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          startUrlTyping();
        }
      });
      portalServerNode.addEventListener("click", startPortalHandshake);
      portalServerNode.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          startPortalHandshake();
        }
      });
      document.getElementById("auth-check-motion").addEventListener("endEvent", () => {
        if (!portalHandshakeStarted) return;
        authResponseVisible = true;
        setStep(currentStep);
      });
      document.getElementById("login-success-motion").addEventListener("endEvent", () => {
        if (currentStep < 10 || !portalHandshakeStarted) return;
        entitlementsReceived = true;
        setStep(currentStep);
      });
      function startShellFlow() {
        if (currentStep !== 2 || shellFlowStarted) return;
        shellFlowStarted = true;
        shellFlowTimer = window.setTimeout(() => {
          shellFlowTimer = null;
          if (currentStep !== 2) return;
          shellResponseVisible = true;
          setStep(currentStep);
          shellFlowTimer = window.setTimeout(() => {
            shellFlowTimer = null;
            if (currentStep !== 2) return;
            shellAppLoaded = true;
            setStep(3);
          }, 1000);
        }, 1000);
      }
      function startNginxFlow() {
        if (currentStep !== 11 || nginxFlowStarted) return;
        nginxFlowStarted = true;
        nginxFlowTimer = window.setTimeout(() => {
          nginxFlowTimer = null;
          if (currentStep !== 11) return;
          nginxResponseVisible = true;
          setStep(currentStep);
          nginxFlowTimer = window.setTimeout(() => {
            nginxFlowTimer = null;
            if (currentStep === 11) setStep(12);
          }, 700);
        }, 850);
      }
      function selectOrders() {
        if (currentStep < 10 || !entitlementsReceived) return;
        ordersSelected = true;
        setStep(Math.max(currentStep, 11));
        startNginxFlow();
      }
      ordersMenuItem.addEventListener("click", selectOrders);
      ordersMenuItem.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectOrders();
        }
      });
      next.addEventListener("click", () => {
        if (
          (currentStep === 1 && !urlTypingComplete)
          || (currentStep === 2 && !shellAppLoaded)
          || (currentStep === 10 && !ordersSelected)
          || (currentStep === 11 && !nginxResponseVisible)
        ) return;
        setStep(currentStep + 1);
      });
      back.addEventListener("click", () => {
        if (currentStep === 2 && currentStep - 1 < 2) {
          window.clearTimeout(shellFlowTimer);
          shellFlowTimer = null;
          shellFlowStarted = false;
          shellResponseVisible = false;
          shellAppLoaded = false;
        }
        if (currentStep === 11 && currentStep - 1 < 11) {
          window.clearTimeout(nginxFlowTimer);
          nginxFlowTimer = null;
          nginxFlowStarted = false;
          nginxResponseVisible = false;
        }
        setStep(currentStep - 1);
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" || event.key === " ") {
          event.preventDefault();
          if (
            (currentStep === 1 && !urlTypingComplete)
            || (currentStep === 2 && !shellAppLoaded)
            || (currentStep === 10 && !ordersSelected)
            || (currentStep === 11 && !nginxResponseVisible)
          ) return;
          setStep(currentStep + 1);
        }
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          if (currentStep === 2 && currentStep - 1 < 2) {
            window.clearTimeout(shellFlowTimer);
            shellFlowTimer = null;
            shellFlowStarted = false;
            shellResponseVisible = false;
            shellAppLoaded = false;
          }
          if (currentStep === 11 && currentStep - 1 < 11) {
            window.clearTimeout(nginxFlowTimer);
            nginxFlowTimer = null;
            nginxFlowStarted = false;
            nginxResponseVisible = false;
          }
          setStep(currentStep - 1);
        }
      });

      setStep(1);
    </script>
  </body>
</html>
