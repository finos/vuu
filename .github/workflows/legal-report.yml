name: Legal report with Maven

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release-*"
  pull_request:
    paths:
      - '**/pom.xml'
      - '.github/workflows/legal-report.yml'

jobs:

  legal-scanning:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package-folder: [ toolbox, vuu, vuu-java, plugin/virtualized-table-plugin, plugin/clickhouse-plugin ]

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

    - name: Set up JDK
      uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520
      with:
        java-version: 21
        java-package: jdk
        distribution: temurin
        cache: 'maven'

    - name: Make mvnw executable
      run: chmod +x mvnw

    - name: License XML report
      run: ./mvnw -B -ntp clean install org.codehaus.mojo:license-maven-plugin:download-licenses -pl ${{ matrix.package-folder }} -am -DskipTests -Dlicense.includedScopes=compile,runtime -DlicensesOutputDirectory=${{ matrix.package-folder }}

    - name: Prepare artifact name
      shell: bash
      run: |
        # Replace all forward slashes with hyphens using bash parameter expansion
        RAW_FOLDER="${{ matrix.package-folder }}"
        echo "SAFE_PACKAGE_NAME=${RAW_FOLDER//\//-}" >> $GITHUB_ENV

    - name: Upload license XML reports
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: ${{ env.SAFE_PACKAGE_NAME }}-license-xml-report
        path: '**/${{ matrix.package-folder }}/target/generated-resources/licenses.xml'
