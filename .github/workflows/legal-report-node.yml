name: Legal report with Node

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release-*"
  pull_request:
    paths:
      - "**/package.json"
      - ".github/workflows/legal-report-node.yml"

jobs:

  scan-packages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.x"

      - name: Checkout UserAdmin package source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: heswell/vuu-websocket
          ref: 60792d0a40a9c0b01d738a98247dc9c04987ff9a
          path: .vuu-websocket

      - name: Build project with NPM
        run: |
          npm run link:user-admin -- ../.vuu-websocket
          npm install --omit=dev
        working-directory: vuu-ui

      - run: npx node-license-validator . --allow-licenses MIT ISC 0BSD BSD BSD-3-Clause Apache-2.0
        working-directory: vuu-ui
